name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log
      - name: Resumo dos erros
        if: failure()
        shell: bash
        run: |
          {
            echo '### Erros de compilação'
            echo '```'
            grep -E '^e: |What went wrong' -A3 build.log | head -c 6000 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: GamepadLayout-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
